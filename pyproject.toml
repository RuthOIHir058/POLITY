[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "polity-engine"
version = "1.0.0"
description = "Deterministic, explainable country policy simulation engine"
readme = "README.md"
license-files = []  # LICENSE_PENDING.md is a notice, not a license grant.
requires-python = ">=3.11,<3.14"
authors = [{name = "RuthOlHir058 and POLITY contributors"}]
keywords = ["simulation", "political-economy", "development", "public-policy", "research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
data = [
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "requests==2.34.2",
]
dev = [
  "coverage==7.13.3",
  "pytest==9.0.2",
]

[project.scripts]
polity = "engine.cli:main"

[project.urls]
Repository = "https://github.com/RuthOlHir058/POLITY"
Documentation = "https://github.com/RuthOlHir058/POLITY#readme"
Issues = "https://github.com/RuthOlHir058/POLITY/issues"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

[tool.setuptools.package-data]
"engine.data" = ["polity.db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["engine"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
